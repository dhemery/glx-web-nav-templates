data:
    title: GLX Archive Web Navigator
templates:
    bases:
        root:
            files:
                - base/root.gotmpl
        list:
            base: root
            files:
                - base/list.gotmpl
        entity:
            base: root
            files:
                - base/entity.gotmpl
    site:
        index.html:
            base: root
            files:
                - index.gotmpl
    types:
        assertions:
            type:
                assertions/index.html:
                    base: list
            entity:
                assertions/<id>/index.html:
                    base: entity
                    files:
                        - assertions/assertion.gotmpl
        citations:
            type:
                citations/index.html:
                    base: list
            entity:
                citations/<id>/index.html:
                    base: entity
                    files:
                        - citations/citation.gotmpl
        events:
            type:
                events/index.html:
                    base: list
            entity:
                events/<id>/index.html:
                    base: entity
                    files:
                        - events/event.gotmpl
        media:
            type:
                media/index.html:
                    base: list
            entity:
                media/<id>/index.html:
                    base: entity
                    files:
                        - media/media.gotmpl
        persons:
            type:
                persons/index.html:
                    base: root
                    files:
                        - persons/index.gotmpl
            entity:
                persons/<id>/index.html:
                    base: entity
                    files:
                        - persons/person.gotmpl
        places:
            type:
                places/index.html:
                    base: list
            entity:
                places/<id>/index.html:
                    base: entity
                    files:
                        - places/place.gotmpl
        relationships:
            type:
                relationships/index.html:
                    base: list
            entity:
                relationships/<id>/index.html:
                    base: entity
                    files:
                        - relationships/relationship.gotmpl
        repositories:
            type:
                repositories/index.html:
                    base: list
            entity:
                repositories/<id>/index.html:
                    base: entity
                    files:
                        - repositories/repository.gotmpl
        sources:
            type:
                sources/index.html:
                    base: list
            entity:
                sources/<id>/index.html:
                    base: entity
                    files:
                        - sources/source.gotmpl
